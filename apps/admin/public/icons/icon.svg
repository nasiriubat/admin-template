<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#635BFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#635BFF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Inner border sheen -->
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Nexus Monogram "N" -->
  <g fill="url(#nGrad)">
    <!-- Left vertical bar -->
    <rect x="140" y="140" width="52" height="232" rx="20"/>
    <!-- Right vertical bar -->
    <rect x="320" y="140" width="52" height="232" rx="20"/>
    <!-- Diagonal crossbar -->
    <path d="M 172 152 L 340 332 C 348 340, 348 352, 338 358 C 330 363, 318 360, 312 352 L 144 172 C 136 164, 136 152, 146 146 C 154 141, 166 144, 172 152 Z" />
  </g>

  <!-- High-tech cyan node accent -->
  <circle cx="346" cy="166" r="22" fill="#06B6D4"/>
  <circle cx="346" cy="166" r="14" fill="#67E8F9"/>
</svg>
